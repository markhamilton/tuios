# GoReleaser configuration for TUIOS
# Documentation: https://goreleaser.com

version: 2

# A release builds what `go install github.com/Gaurav-Gosain/tuios/cmd/tuios@<tag>`
# builds: the Go libraries in this repository (such as progstatus/) at the
# versions go.mod pins, not the folders go.work points at. The release
# workflow checks first that the two hold the same code (scripts/library-pins.sh).
env:
  - GOWORK=off

# A library in this repository is tagged with its folder as a prefix, such as
# progstatus/v0.1.0. Those tags are not tuios releases. git describe skips them
# with this pattern. The release workflow also passes GORELEASER_PREVIOUS_TAG,
# because GoReleaser compares the tags at the previous commit by exact name.
git:
  ignore_tags:
    - "*/v*"

before:
  hooks:
    # Ensure dependencies are up to date
    - go mod tidy
    # Run tests before building
    # - go test ./...

builds:
  - id: tuios
    main: ./cmd/tuios
    binary: tuios
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
      - arm
      - "386"
    goarm:
      - "6"
      - "7"
    ignore:
      # Windows ARM builds are not commonly needed
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      # FreeBSD/OpenBSD ARM builds
      - goos: freebsd
        goarch: arm
      - goos: openbsd
        goarch: arm
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

  # Termux on Android. A linux build stops there with SIGSYS: Go's linux
  # os/exec calls faccessat2, and Android's seccomp policy for apps traps it.
  # Go leaves that call out when GOOS is android. android/arm needs cgo, so
  # only arm64 is built.
  - id: tuios-android
    main: ./cmd/tuios
    binary: tuios
    env:
      - CGO_ENABLED=0
    goos:
      - android
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

  # The ghostty builds link libghostty-vt (static, built by
  # scripts/ghostty-lib.sh at a pinned commit) behind the ghostty build tag.
  # One build per target because cgo needs a per-target compiler; zig is the
  # cross C compiler for all of them. Pure-Go builds above stay the default
  # and keep go install working with no toolchain.
  - id: tuios-ghostty-linux-amd64
    main: ./cmd/tuios
    binary: tuios
    tags:
      - ghostty
    env:
      - CGO_ENABLED=1
      - CC={{ .Env.PWD }}/scripts/zigcc/x86_64-linux-gnu
      - PKG_CONFIG_PATH={{ .Env.PWD }}/.ghostty-vt/x86_64-linux-gnu/pkgconfig
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

  - id: tuios-ghostty-linux-arm64
    main: ./cmd/tuios
    binary: tuios
    tags:
      - ghostty
    env:
      - CGO_ENABLED=1
      - CC={{ .Env.PWD }}/scripts/zigcc/aarch64-linux-gnu
      - PKG_CONFIG_PATH={{ .Env.PWD }}/.ghostty-vt/aarch64-linux-gnu/pkgconfig
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

  - id: tuios-ghostty-windows-amd64
    main: ./cmd/tuios
    binary: tuios
    tags:
      - ghostty
    env:
      - CGO_ENABLED=1
      - CC={{ .Env.PWD }}/scripts/zigcc/x86_64-windows-gnu
      - PKG_CONFIG_PATH={{ .Env.PWD }}/.ghostty-vt/x86_64-windows-gnu/pkgconfig
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

  # The ghostty builds link libghostty-vt (static, built by
  # scripts/ghostty-lib.sh at a pinned commit) behind the ghostty build tag.
  # One build per target because cgo needs a per-target compiler; zig is the
  # cross C compiler for all of them. Pure-Go builds above stay the default
  # and keep go install working with no toolchain.
  - id: tuios-ghostty-windows-arm64
    main: ./cmd/tuios
    binary: tuios
    tags:
      - ghostty
    env:
      - CGO_ENABLED=1
      - CC={{ .Env.PWD }}/scripts/zigcc/aarch64-windows-gnu
      - PKG_CONFIG_PATH={{ .Env.PWD }}/.ghostty-vt/aarch64-windows-gnu/pkgconfig
    goos:
      - windows
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

  # The command-line tools of the Go libraries in this repository. Each is a
  # package of its library's module, so it builds in the library's folder
  # with that module's own requirements, as `go install
  # tuios.dev/<library>/cmd/<tool>@latest` does. tuios does not import them.
  - id: sketch
    dir: sketch
    main: ./cmd/sketch
    binary: sketch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    flags:
      - -trimpath

  - id: tplot
    dir: plot
    main: ./cmd/tplot
    binary: tplot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    flags:
      - -trimpath

  - id: tml
    dir: loom
    main: ./cmd/tml
    binary: tml
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    flags:
      - -trimpath

archives:
  - id: tuios-archive
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    ids:
      - tuios
    files:
      - README.md
      - LICENSE*
      # tuios links tuios.dev/sketch, a port of pele (MIT), and draws its
      # pictures in Arimo (SIL OFL 1.1) and Go Mono. Both licences ask to
      # travel with copies of the binary.
      - src: sketch/LICENSE
        dst: licenses/sketch/LICENSE
      - src: sketch/raster/fonts/NOTICE
        dst: licenses/sketch/NOTICE

  # Its own archive, so that the AUR and Homebrew entries, which take
  # tuios-archive, do not see it. tuios update finds it by the same name rule.
  - id: tuios-android-archive
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- .Arch }}
    ids:
      - tuios-android
    files:
      - README.md
      - LICENSE*
      - src: sketch/LICENSE
        dst: licenses/sketch/LICENSE
      - src: sketch/raster/fonts/NOTICE
        dst: licenses/sketch/NOTICE

  - id: tuios-ghostty-archive
    name_template: >-
      {{ .ProjectName }}-ghostty_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    ids:
      - tuios-ghostty-linux-amd64
      - tuios-ghostty-linux-arm64
      - tuios-ghostty-windows-amd64
      - tuios-ghostty-windows-arm64
    files:
      - README.md
      - LICENSE*
      # tuios links tuios.dev/sketch, a port of pele (MIT), and draws its
      # pictures in Arimo (SIL OFL 1.1) and Go Mono. Both licences ask to
      # travel with copies of the binary.
      - src: sketch/LICENSE
        dst: licenses/sketch/LICENSE
      - src: sketch/raster/fonts/NOTICE
        dst: licenses/sketch/NOTICE


  - id: sketch-archive
    name_template: >-
      sketch_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    ids:
      - sketch
    files:
      - src: sketch/README.md
        dst: README.md
      # sketch is a port of pele (MIT) and draws its pictures in Arimo
      # (SIL OFL 1.1) and Go Mono. Both licences travel with the binary.
      - src: sketch/LICENSE
        dst: LICENSE
      - src: sketch/raster/fonts/NOTICE
        dst: NOTICE

  - id: tplot-archive
    name_template: >-
      tplot_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    ids:
      - tplot
    files:
      - src: plot/README.md
        dst: README.md
      - src: plot/LICENSE
        dst: LICENSE

  - id: tml-archive
    name_template: >-
      tml_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    ids:
      - tml
    files:
      - src: loom/README.md
        dst: README.md
      - src: loom/LICENSE
        dst: LICENSE


checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Performance Improvements"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Documentation"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "Other Changes"
      order: 999

release:
  draft: false
  prerelease: auto
  mode: replace

